<svg width="1500" height="500" viewBox="0 0 1500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="xb-bg" x1="0" y1="0" x2="1500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>
    <linearGradient id="xb-primary" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="xb-card" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="xb-glow-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 250) scale(400)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="xb-glow-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1300 250) scale(400)">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <pattern id="xb-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#34D399" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#xb-bg)" />
  <rect width="1500" height="500" fill="url(#xb-grid)" />
  <rect width="1500" height="500" fill="url(#xb-glow-left)" />
  <rect width="1500" height="500" fill="url(#xb-glow-right)" />

  <!-- Abstract Circuit Traces (Background) -->
  <path d="M 50 120 L 220 120 L 280 180 L 450 180" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 4" fill="none" />
  <path d="M 150 400 L 320 400 L 380 340 L 520 340" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 4" fill="none" />
  <path d="M 1050 100 L 1200 100 L 1280 180 L 1450 180" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 4" fill="none" />
  <path d="M 980 420 L 1150 420 L 1220 350 L 1420 350" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 4" fill="none" />

  <!-- Left: Emblem / Shield Mark -->
  <g transform="translate(140, 110)">
    <!-- Outer Glow -->
    <path d="M 140 10 L 250 60 V 160 C 250 235 195 295 140 315 C 85 295 30 235 30 160 V 60 Z" 
          fill="#10B981" opacity="0.1" />
    <!-- Shield Border -->
    <path d="M 140 10 L 250 60 V 160 C 250 235 195 295 140 315 C 85 295 30 235 30 160 V 60 Z" 
          stroke="url(#xb-primary)" stroke-width="8" stroke-linejoin="round" fill="#0B132B" />
    <!-- Inner Circuit -->
    <path d="M 140 55 L 210 95 V 175 L 140 215 L 70 175 V 95 Z" 
          stroke="url(#xb-primary)" stroke-width="3" stroke-dasharray="6 4" opacity="0.6" fill="none" />
    <!-- Lock Aperture -->
    <circle cx="140" cy="125" r="26" stroke="url(#xb-primary)" stroke-width="6" fill="none" />
    <circle cx="140" cy="125" r="10" fill="#34D399" />
    <path d="M 128 142 L 118 190 H 162 L 152 142" fill="url(#xb-primary)" />
    <!-- Witness Nodes -->
    <circle cx="140" cy="55" r="5" fill="#34D399" />
    <circle cx="210" cy="95" r="5" fill="#34D399" />
    <circle cx="210" cy="175" r="5" fill="#06B6D4" />
    <circle cx="140" cy="215" r="5" fill="#06B6D4" />
    <circle cx="70" cy="175" r="5" fill="#06B6D4" />
    <circle cx="70" cy="95" r="5" fill="#34D399" />
  </g>

  <!-- Center-Left Typography -->
  <g transform="translate(460, 160)">
    <!-- Badge -->
    <rect x="0" y="0" width="270" height="32" rx="16" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#34D399" />
    <text x="30" y="21" fill="#34D399" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">BUILT ON MIDNIGHT</text>

    <!-- Brand Name -->
    <text x="0" y="105" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="-1.5">VeilPass</text>
    <text x="325" y="105" fill="#10B981" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="76" font-weight="900">.</text>

    <!-- Tagline -->
    <text x="0" y="152" fill="#E2E8F0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.2">Zero-Knowledge Age &amp; Eligibility Credential Gate</text>
    <text x="0" y="184" fill="#94A3B8" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">Prove age threshold ≥ 18 locally. Your birth year never leaves your wallet.</text>
  </g>

  <!-- Right Side Interactive Feature Cards (Vector graphic) -->
  <g transform="translate(1040, 100)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="360" height="85" rx="12" fill="url(#xb-card)" stroke="#334155" stroke-width="1" />
    <rect x="16" y="18" width="48" height="48" rx="8" fill="#10B981" fill-opacity="0.15" />
    <path d="M 40 32 L 48 38 L 40 44" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="76" y="40" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700">Client-Side ZK Witness</text>
    <text x="76" y="60" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="12">0 bytes of PII broadcast on-chain</text>

    <!-- Card 2 -->
    <rect x="0" y="105" width="360" height="85" rx="12" fill="url(#xb-card)" stroke="#334155" stroke-width="1" />
    <rect x="16" y="123" width="48" height="48" rx="8" fill="#06B6D4" fill-opacity="0.15" />
    <circle cx="40" cy="147" r="9" stroke="#06B6D4" stroke-width="2.5" fill="none" />
    <path d="M 36 147 L 39 150 L 45 144" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" fill="none" />
    <text x="76" y="145" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700">Compact Circuit (k=13)</text>
    <text x="76" y="165" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="12">Replay-resistant 32-byte nullifiers</text>

    <!-- Card 3 -->
    <rect x="0" y="210" width="360" height="85" rx="12" fill="url(#xb-card)" stroke="#334155" stroke-width="1" />
    <rect x="16" y="228" width="48" height="48" rx="8" fill="#A855F7" fill-opacity="0.15" />
    <rect x="30" y="244" width="20" height="16" rx="3" stroke="#A855F7" stroke-width="2" fill="none" />
    <circle cx="40" cy="252" r="2.5" fill="#A855F7" />
    <text x="76" y="250" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700">Lace &amp; 1AM Wallet Interop</text>
    <text x="76" y="270" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="12">Direct DApp Connector integration</text>
  </g>
</svg>
