name: VeilPass CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Type Check ───────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Type check
        run: bunx tsc --noEmit
        continue-on-error: true

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ── Verify Contracts ────────────────────────────────────────────────────────
  contracts:
    name: Compact Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify contract files exist
        run: |
          echo "Checking contract files..."
          ls -la contracts/
          test -f contracts/AgeGate.compact && echo "✅ AgeGate.compact found"
          test -f contracts/PrivateVoting.compact && echo "✅ PrivateVoting.compact found"
          test -f contracts/managed-api.ts && echo "✅ managed-api.ts found"
          echo "Contract verification complete."

      - name: Validate Compact syntax (static check)
        run: |
          echo "Validating Compact contract syntax..."
          # Check pragma is present
          grep -q "pragma language_version >= 0.23" contracts/AgeGate.compact && echo "✅ AgeGate.compact: pragma OK"
          grep -q "pragma language_version >= 0.23" contracts/PrivateVoting.compact && echo "✅ PrivateVoting.compact: pragma OK"
          # Check for required exports
          grep -q "export circuit proveAge" contracts/AgeGate.compact && echo "✅ AgeGate.compact: proveAge circuit OK"
          grep -q "export circuit castVote" contracts/PrivateVoting.compact && echo "✅ PrivateVoting.compact: castVote circuit OK"
          echo "All contract validations passed."
