name: VeilPass CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Type Check & Validation ──────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Type check (tsc)
        run: npx tsc --noEmit

  # ── 2. Test Suite Execution ─────────────────────────────────────────────────
  test:
    name: Vitest Test Suite (28 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run test suite
        run: npx vitest run --reporter=verbose

  # ── 3. Production Build ─────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-output
          path: .output/
          retention-days: 3

  # ── 4. Verify Compact Smart Contracts ───────────────────────────────────────
  contracts:
    name: Compact Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify contract files exist
        run: |
          echo "Checking contract files..."
          ls -la contracts/
          test -f contracts/AgeGate.compact && echo "✅ AgeGate.compact found"
          test -f contracts/PrivateVoting.compact && echo "✅ PrivateVoting.compact found"
          test -f contracts/managed-api.ts && echo "✅ managed-api.ts found"
          test -f contracts/deployment.json && echo "✅ deployment.json found"
          echo "Contract verification complete."

      - name: Validate Compact syntax and exports
        run: |
          echo "Validating Compact contract syntax..."
          grep -q "pragma language_version >= 0.23" contracts/AgeGate.compact && echo "✅ AgeGate.compact: pragma OK"
          grep -q "pragma language_version >= 0.23" contracts/PrivateVoting.compact && echo "✅ PrivateVoting.compact: pragma OK"
          grep -q "export circuit proveAge" contracts/AgeGate.compact && echo "✅ AgeGate.compact: proveAge circuit OK"
          grep -q "export circuit castVote" contracts/PrivateVoting.compact && echo "✅ PrivateVoting.compact: castVote circuit OK"
          echo "All contract validations passed."
